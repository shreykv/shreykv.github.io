  const top = board.rows[0];
  if (top && top.count > 0) res.top = { pid: top.id, value: top.count + ' ' + plural(top.count, 'drink') };

  const shots = pick(id => known.get(id).by.shot || 0, 2);
  if (shots) res.shots = { pid: shots.pid, value: shots.v + ' shots' };
  const water = pick(id => known.get(id).water, 2);
  if (water) res.water = { pid: water.pid, value: water.v + ' waters' };
  const zero = pick(id => known.get(id).zero, 2);
  if (zero) res.zero = { pid: zero.pid, value: zero.v + ' zero proof' };

  const orders = new Map();
  for (const [pid, a] of mine) { const m = new Map(); for (const d of a) { const k = d.l ? d.t + '|' + d.l.toLowerCase() : d.t; m.set(k, (m.get(k) || 0) + d.q); } orders.set(pid, m); }
  const variety = pick(id => (orders.get(id) ? orders.get(id).size : 0), 3);
  if (variety) res.variety = { pid: variety.pid, value: variety.v + ' different orders', short: variety.v + ' orders' };

  let first = null, last = null;
  for (const a of mine.values()) for (const d of a) {
    if (!first || d.ts < first.ts) first = d;
    const late = d.ts - partyDayStart(partyDay(d.ts));
    if (!last || late > last.late) last = { d, late };
  }
  if (first) res.first = { pid: first.p, value: fmtTime(first.ts), ts: first.ts };
  if (last && board.tot.count > 1) res.last = { pid: last.d.p, value: fmtTime(last.d.ts), ts: last.d.ts };

  const speedOf = new Map();
  for (const [pid, a] of mine) {
    let best = 0, lo = 0, run = 0;
    for (let hi = 0; hi < a.length; hi++) { run += a[hi].q; while (a[hi].ts - a[lo].ts > HOUR) { run -= a[lo].q; lo++; } if (run > best) best = run; }
    speedOf.set(pid, best);
  }
  const speed = pick(id => speedOf.get(id) || 0, 3);
  if (speed) res.speed = { pid: speed.pid, value: speed.v + ' in an hour' };

  const rounds = new Map();
  for (const d of drinks) { if (!d.r || !d.by) continue; let r = rounds.get(d.r); if (!r) rounds.set(d.r, (r = { by: d.by, who: new Set() })); r.who.add(d.p); }
  const called = new Map();
  for (const r of rounds.values()) if (r.who.size >= 3) called.set(r.by, (called.get(r.by) || 0) + 1);
  const caller = pick(id => called.get(id) || 0, 1);
  if (caller) res.rounds = { pid: caller.pid, value: caller.v + ' ' + plural(caller.v, 'round') + ' called', short: caller.v + ' ' + plural(caller.v, 'round') };

  let habit = null;
  for (const id of order) {
    const m = orders.get(id); if (!m) continue;
    let total = 0, bestK = '', bestN = 0;
    for (const [k, n] of m) { total += n; if (n > bestN) { bestN = n; bestK = k; } }
    if (total < 4 || bestN / total < 0.6) continue;
    const share = bestN / total;
    if (!habit || share > habit.share || (share === habit.share && bestN > habit.n)) {
      const parts = bestK.split('|');
      const sample = parts[1] ? (mine.get(id).find(d => d.l && d.l.toLowerCase() === parts[1]) || {}).l : '';
      habit = { pid: id, share, n: bestN, total, what: sample || TYPE[parts[0]].many };
    }
  }
  if (habit) res.habit = { pid: habit.pid, value: habit.n + ' of ' + habit.total + ': ' + habit.what };

  let span = null;
  for (const [pid, a] of mine) {
    const days = new Map();
    for (const d of a) { const k = partyDay(d.ts); const e = days.get(k) || { lo: d.ts, hi: d.ts, n: 0 }; e.lo = Math.min(e.lo, d.ts); e.hi = Math.max(e.hi, d.ts); e.n += d.q; days.set(k, e); }
    for (const e of days.values()) if (e.n >= 3 && e.hi - e.lo >= HOUR && (!span || e.hi - e.lo > span.ms)) span = { pid, ms: e.hi - e.lo };
  }
  if (span) res.span = { pid: span.pid, value: fmtDur(span.ms) + ' first to last', short: fmtDur(span.ms) };

  if (stops.length >= 2) {
    const S = indexBy(stops);
    const been = new Map();
    const mark = (pid, sid) => { if (!known.has(pid) || !S[sid]) return; let s = been.get(pid); if (!s) been.set(pid, (s = new Set())); s.add(sid); };
    for (const c of checkins) mark(c.p, c.s);
    for (const d of drinks) if (d.s) mark(d.p, d.s);
    const cap = pick(id => (been.get(id) ? been.get(id).size : 0), 2);
    if (cap) res.crawl = { pid: cap.pid, value: cap.v === stops.length ? 'All ' + cap.v + ' stops' : cap.v + ' of ' + stops.length + ' stops' };
  }
  return AWARDS.map(a => Object.assign({}, a, res[a.id] || { pid: null, value: '' }));
}

/* ── the crawl ── */
function crawlStats(stops, drinks, checkins, players, now) {
  const P = indexBy(players);
  const sorted = [...stops].sort((a, b) => a.o - b.o || a.at - b.at || a.id.localeCompare(b.id));
  let cur = null;
  for (const s of sorted) if (s.a && !s.d && (!cur || s.a > cur.a)) cur = s;
  const rows = sorted.map((s, i) => {
    const per = new Map(); let n = 0, zero = 0;
    for (const d of drinks) {
      if (d.s !== s.id || !P[d.p]) continue;
      if (isAlc(d.t)) { n += d.q; per.set(d.p, (per.get(d.p) || 0) + d.q); } else zero += d.q;
    }
    const here = new Set();
    let stars = 0, votes = 0;
    for (const c of checkins) { if (c.s !== s.id || !P[c.p]) continue; here.add(c.p); if (c.r) { stars += c.r; votes++; } }
    for (const d of drinks) if (d.s === s.id && P[d.p]) here.add(d.p); // logging anything at a stop puts you there
    let mvp = null;
    for (const [pid, v] of per) if (!mvp || v > mvp.n) mvp = { pid, n: v };
    const status = cur && cur.id === s.id ? 'now' : s.a ? 'done' : 'next';
    const end = s.d || (status === 'now' ? now : 0);
    return { stop: s, i, status, drinks: n, zero, people: [...here], mvp, rating: votes ? stars / votes : 0, votes, dur: s.a && end ? Math.max(0, end - s.a) : 0 };
  });
  let next = null;
  if (cur) { const at = rows.findIndex(r => r.stop.id === cur.id); next = rows.slice(at + 1).find(r => r.status === 'next') || null; }
  if (!next) next = rows.find(r => r.status === 'next') || null;
  const started = rows.filter(r => r.stop.a).map(r => r.stop.a);
  const begun = started.length ? Math.min(...started) : 0;
  const lastOut = Math.max(0, ...rows.map(r => r.stop.d || 0));
  return {
    rows, cur: cur ? rows.find(r => r.stop.id === cur.id) : null, next: next || null,
    done: rows.filter(r => r.status === 'done').length, visited: rows.filter(r => r.status !== 'next').length,
    drinks: sum(rows, r => r.drinks), begun, elapsed: begun ? (cur ? now : lastOut || now) - begun : 0, live: !!cur,
    maxDrinks: Math.max(0, ...rows.map(r => r.drinks)),
  };
}

/* ── one player ── */
function profileStats(pid, drinks, stops, checkins, now) {
  const mineAll = drinks.filter(d => d.p === pid).sort((a, b) => b.ts - a.ts);
  const today = partyDay(now);
  const fav = new Map();
  let todayCount = 0;
  for (const d of mineAll) {
    if (!isAlc(d.t)) continue;
    if (partyDay(d.ts) === today) todayCount += d.q;
    const k = d.l ? d.t + '|' + d.l.toLowerCase() : d.t;
    const e = fav.get(k) || { t: d.t, label: d.l || TYPE[d.t].name, n: 0 };
    e.n += d.q; fav.set(k, e);
  }
  const favs = [...fav.values()].sort((a, b) => b.n - a.n);
  const S = indexBy(stops);
  const been = new Set();
  for (const c of checkins) if (c.p === pid && S[c.s]) been.add(c.s);
  for (const d of mineAll) if (d.s && S[d.s]) been.add(d.s);
  return { recent: mineAll.slice(0, 12), all: mineAll, today: todayCount, fav: favs[0] || null, favs: favs.slice(0, 4), stops: been };
}

/* ───────────────────────── sync ─────────────────────────
   One small layer between the screens and wherever the data lives.
   - RemoteBackend: the artifact's shared database (everyone sees the same board, live).
   - MemoryBackend: this device only (solo mode, the sample preview).
   On top of either one, createSync() keeps an optimistic outbox: a tap shows up
   instantly, survives a dead zone in the bar, and is sent when the signal returns. */

function RemoteBackend(db) {
  return {
    kind: 'remote',
    watch(col, next, err) {
      return db.collection(col).limit(1000).onSnapshot(
        snap => {
          const list = [];
          for (const d of snap.docs) { const data = d.data(); if (data) list.push({ id: d.id, data }); }
          next(list, snap.metadata || {});
        },
        e => err(e || { code: 'unavailable' })
      );
    },
    set: (path, data) => db.doc(path).set(data),
    update: (path, data) => db.doc(path).update(data),
    del: path => db.doc(path).delete(),
  };
}

function NullBackend() {
  const no = () => Promise.reject({ code: 'not_granted', message: 'no store' });
  return { kind: 'null', watch: () => () => {}, set: no, update: no, del: no };
}

function MemoryBackend(opts) {
  opts = opts || {};
  const docs = new Map();      // path → data
  const watchers = new Map();  // collection → Set(listener)
  if (opts.persistKey) { const saved = ls.get(opts.persistKey, null); if (saved && typeof saved === 'object') for (const k in saved) docs.set(k, saved[k]); }
  if (opts.seed) for (const k in opts.seed) docs.set(k, opts.seed[k]);
  let saveT = 0;
  const persist = () => {
    if (!opts.persistKey) return;
    clearTimeout(saveT);
    saveT = setTimeout(() => { const o = {}; docs.forEach((v, k) => { o[k] = v; }); ls.set(opts.persistKey, o); }, 200);
  };
  const colOf = path => path.slice(0, path.lastIndexOf('/'));
  const list = col => {
    const out = [], pre = col + '/';
    docs.forEach((v, k) => { if (k.startsWith(pre) && k.indexOf('/', pre.length) === -1) out.push({ id: k.slice(pre.length), data: v }); });
    out.sort((a, b) => (a.id < b.id ? -1 : 1));
    return out;
  };
  const meta = { fromCache: false, hasPendingWrites: false };
  const emit = col => { const set = watchers.get(col); if (set && set.size) { const l = list(col); set.forEach(f => f(l, meta)); } };
  return {
    kind: opts.kind || 'memory',
    watch(col, next) {
      let set = watchers.get(col);
      if (!set) watchers.set(col, (set = new Set()));
      set.add(next);
      let live = true;
      Promise.resolve().then(() => { if (live) next(list(col), meta); });
      return () => { live = false; set.delete(next); };
    },
    set(path, data) { docs.set(path, Object.freeze(Object.assign({}, data))); persist(); emit(colOf(path)); return Promise.resolve(); },
    update(path, data) {
      const cur = docs.get(path);
      if (!cur) return Promise.reject({ code: 'invalid_argument', message: 'no such document' });
      docs.set(path, Object.freeze(Object.assign({}, cur, data))); persist(); emit(colOf(path)); return Promise.resolve();
    },
    del(path) { if (docs.delete(path)) { persist(); emit(colOf(path)); } return Promise.resolve(); },
  };
}

function createSync(backend, opts) {

    const saved = ls.get(opts.outboxKey, []);

        if (!x || typeof x.path !== 'string' || !x.kind) continue;
        const i = x.path.lastIndexOf('/');

  }

  }

    const c = viewCache.get(col);
    if (c && c.v === v) return c.list;
    const m = new Map(remote.get(col) || EMPTY);
    const pend = new Set();
    for (const op of ops) {
      if (op.col !== col) continue;
      if (op.kind === 'set') { m.set(op.docId, op.data); if (op.state !== 'done') pend.add(op.docId); }

  function push(kind, path, data) {

  };
}

const engine = { sync: null, mode: 'boot', hint: null, un: [], parked: null, perms: null };

function attach(sync, mode, why) {

  function dayKeys() {
    const now = Date.now();
    const keys = new Set([dayKeyUTC(now), dayKeyUTC(now - DAY)]);

    for (const p of sync.pendingPaths()) { const m = /^days\/(\d{8})\/drinks\//.exec(p); if (m) keys.add(m[1]); }

  }

    const pl = sync.docs('players');

    const mt = sync.docs('meta');
    if (mt !== memo.mt) { memo.mt = mt; const t = mt.find(d => d.id === 'trip'); memo.trip = t ? { title: cleanText(t.title, 60) } : {}; }

    const lists = keys.map((k, i) => { const l = sync.docs(DRINK_COL(k)); if (l !== memo.dlists[i] || k !== memo.dkeys[i]) changed = true; return l; });
    if (changed) {
      memo.dkeys = keys; memo.dlists = lists;
      const out = [];
      lists.forEach((l, i) => { for (const d of l) { const n = normDrink(d.id, d, keys[i]); if (n) out.push(n); } });

      players: memo.players, drinks: memo.drinks, stops: memo.stops, checkins: memo.checkins, trip: memo.trip,
      pending: s.pending, retrying: s.retrying, dead: s.dead,

    } else if (ev.type === 'bad') {
      toast('One change could not be saved. Try it again.', { tone: 'warn' });
    } else if (ev.type === 'quota') {
      toast('The board is full. Clear old test drinks from Crew and settings.', { tone: 'warn', long: true });
    } else rebuild();
  }));

}

/* ── can this person change things right now? ── */
function canAct() {

}
function guard() {

}
const P = id => dataStore.get().players.find(p => p.id === id) || null;

  for (let i = 0; i < N_COLORS; i++) { const c = (taken.length + i) % N_COLORS; if (taken.indexOf(c) === -1) return c; }

}

const A = {

  },

  addPlayers(list) {

/* labels this phone has typed before, newest first */
function rememberLabel(t, label) {
  const l = cleanText(label, 32);
  if (!l) return;
  const all = ls.get(K.labels, {}) || {};
  const cur = (all[t] || []).filter(x => x.toLowerCase() !== l.toLowerCase());
  cur.unshift(l);
  all[t] = cur.slice(0, 6);
  ls.set(K.labels, all);
}
function labelIdeas(t, drinks) {
  const seen = new Set(), out = [];
  const add = l => { const k = l.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(l); } };
  ((ls.get(K.labels, {}) || {})[t] || []).forEach(add);
  const counts = new Map();
  for (const d of drinks) if (d.t === t && d.l) counts.set(d.l, (counts.get(d.l) || 0) + d.q);
  [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).forEach(e => add(e[0]));
  TYPE[t].quick.forEach(add);
  return out.slice(0, 9);

/* ───────────────────────── sample preview ─────────────────────────
   A made-up weekend so the board can be seen full before the real one starts.
   It lives in memory only: nothing here is written to the shared board. */
function demoSeed(now) {
  let seedN = 20261010;
  const rnd = () => { seedN = (seedN + 0x6d2b79f5) | 0; let t = Math.imul(seedN ^ (seedN >>> 15), 1 | seedN); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pickW = pairs => { let total = 0; for (const p of pairs) total += p[1]; let r = rnd() * total; for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; } return pairs[0][0]; };
  const seed = {};
  const crew = [
    ['Pruth', 'Pruth the Goof', 1.05, 'beer'], ['Best Man', '', 1.25, 'spirit'], ['The Brother', '', 1.1, 'beer'], ['Roomie', 'College roommate', 0.95, 'cocktail'],
    ['Moose', '', 1.35, 'beer'], ['Tank', '', 1.2, 'shot'], ['Smitty', '', 0.9, 'seltzer'], ['Doc', '', 0.55, 'wine'], ['Coach', '', 0.8, 'beer'],
    ['Ace', '', 1.0, 'cocktail'], ['Duke', '', 0.85, 'spirit'], ['Sarge', '', 1.15, 'beer'], ['Gooch', '', 0.7, 'seltzer'], ['Skip', '', 0.35, 'zero'], ['Chief', '', 1.0, 'beer'],
  ];
  const pids = crew.map((c, i) => {
    const id = 'demo' + String(i).padStart(2, '0');
    const data = { n: c[0], c: i % N_COLORS, at: 1000 + i };
    if (c[1]) data.k = c[1];
    if (i === 0) data.g = true;
    seed['players/' + id] = data;
    return id;
  });
  seed['meta/trip'] = { title: DEFAULT_TRIP };

  const stopNames = [['The Warm-Up', 'Wings first'], ['The Dive', 'Cash only'], ['The Rooftop', ''], ['Karaoke Bar', 'Pruth sings at 11'], ['Last Call', '']];
  const times = [now - 168 * MIN, now - 104 * MIN, now - 41 * MIN];
  const stops = stopNames.map((s, i) => {
    const id = 'stop' + i;
    const data = { n: s[0], o: i + 1, at: 2000 + i };
    if (s[1]) data.note = s[1];
    if (times[i]) { data.a = times[i]; if (times[i + 1]) data.d = times[i + 1] - 9 * MIN; }
    seed['stops/' + id] = data;
    return { id, a: data.a || 0, d: data.d || (data.a ? now : 0) };
  });
  const stopAt = ts => { for (const s of stops) if (s.a && ts >= s.a && ts <= s.d) return s.id; return ''; };

  let n = 0;
  const days = new Set();
  const here = new Map();
  const put = (pid, t, ts, extra) => {
    if (ts > now - 30e3) return;
    const key = dayKeyUTC(ts);
    days.add(key);
    const data = Object.assign({ p: pid, t, q: 1, ts: Math.round(ts) }, extra || {});
    const s = stopAt(ts);
    if (s) { data.s = s; if (!here.has(s)) here.set(s, new Set()); here.get(s).add(pid); }
    if (!data.l && rnd() < 0.68) { const q = TYPE[t].quick; data.l = q[Math.floor(rnd() * Math.min(q.length, 4))]; }
    seed[DRINK_COL(key) + '/dd' + String(n++).padStart(4, '0')] = data;
  };
  const typeFor = fav => {
    if (fav === 'zero') return pickW([['zero', 6], ['water', 3], ['beer', 0.6]]);
    return pickW([[fav, 5], ['beer', 2.2], ['cocktail', 1.2], ['shot', 1.1], ['seltzer', 0.9], ['spirit', 0.7], ['wine', 0.4]]);
  };
  // spread drinks over a window, weighted toward its back half
  const session = (lo, hi, base) => {
    if (hi - lo < 20 * MIN) return;
    const hours = (hi - lo) / HOUR;
    crew.forEach((c, i) => {
      const count = Math.max(0, Math.round(base * hours * c[2] * (0.75 + rnd() * 0.5)));
      for (let k = 0; k < count; k++) { const u = Math.pow(rnd(), 0.72); put(pids[i], typeFor(c[3]), lo + u * (hi - lo)); }
      const waters = Math.round(count * (0.12 + rnd() * 0.3));
      for (let k = 0; k < waters; k++) put(pids[i], 'water', lo + rnd() * (hi - lo));
    });
  };
  const today = partyDayStart(partyDay(now));
  session(today - DAY + 10.5 * HOUR, today - DAY + 20.6 * HOUR, 0.78);       // yesterday, mid afternoon to late
  session(Math.max(today + 6 * HOUR, now - 9 * HOUR), now - 172 * MIN, 0.62); // today before the crawl
  session(now - 168 * MIN, now, 1.25);                                         // the crawl so far
  // a few rounds of shots at the bars
  [[now - 150 * MIN, 1, 7], [now - 88 * MIN, 5, 9], [now - 26 * MIN, 1, 6], [today - DAY + 18 * HOUR, 4, 8]].forEach((r, ri) => {
    const order = pids.slice().sort(() => rnd() - 0.5).filter(id => id !== 'demo13').slice(0, r[2]);
    const by = pids[r[1]];
    if (order.indexOf(by) === -1) order[0] = by;
    order.forEach(pid => put(pid, 'shot', r[0] + rnd() * 40e3, { r: 'round' + ri, by, l: ri % 2 ? 'Tequila' : 'Green tea' }));
  });
  days.forEach(k => { seed['days/' + k] = { k, at: 1 }; });
  stops.forEach((s, si) => {
    if (!s.a) return;
    const set = here.get(s.id) || new Set();
    pids.forEach((pid, i) => {
      if (!set.has(pid) && rnd() > 0.72 - si * 0.2) return;
      const data = { s: s.id, p: pid, ts: s.a + rnd() * 6 * MIN };
      if (rnd() < 0.6 && (s.d < now || rnd() < 0.5)) data.r = 3 + Math.floor(rnd() * 3) - (si === 1 && i % 3 === 0 ? 1 : 0);
      seed['checkins/' + s.id + '.' + pid] = data;
    });
  });
  return seed;
}

function replaceSheet(type, props) { ui.set(s => ({ sheets: s.sheets.slice(0, -1).concat([{ id: uid(), type, props: props || {}, closing: false }]) })); }

function Sheet({ title, sub, lead, children, foot, closing }) {
  const ref = useRef(null);
  const drag = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const before = document.activeElement;
    const first = el.querySelector('[data-autofocus]');
    try { (first || el).focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    const key = e => {
      if (e.key === 'Escape') { e.stopPropagation(); closeSheet(); return; }
      if (e.key !== 'Tab') return;
      const f = el.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === a || document.activeElement === el)) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    };
    el.addEventListener('keydown', key);
    return () => { el.removeEventListener('keydown', key); try { if (before && before.focus && document.contains(before)) before.focus({ preventScroll: true }); } catch (e) { /* ignore */ } };
  }, []);
  // drag the grabber down to dismiss
  const down = e => { if (e.pointerType === 'mouse' && e.button !== 0) return; drag.current = { y: e.clientY, t: performance.now(), dy: 0 }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } };
  const move = e => { const d = drag.current; if (!d) return; d.dy = Math.max(0, e.clientY - d.y); ref.current.style.transform = 'translateY(' + d.dy + 'px)'; ref.current.style.transition = 'none'; };
  const up = () => {
    const d = drag.current; drag.current = null;
    if (!d) return;
    const el = ref.current, fast = d.dy / Math.max(1, performance.now() - d.t) > 0.55;
    el.style.transition = ''; el.style.transform = '';
    if (d.dy > 110 || (fast && d.dy > 30)) closeSheet();
  };
  return html`<div class=${'sheet-wrap' + (closing ? ' is-closing' : '')}>
    <div class="scrim" onClick=${() => closeSheet()}></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label=${title} ref=${ref} tabindex="-1">
      <div class="sheet-grab" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}><i></i></div>
      <header class="sheet-head">
        ${lead}
        <div class="sheet-titles"><h2>${title}</h2>${sub && html`<p>${sub}</p>`}</div>
        <button type="button" class="iconbtn" aria-label="Close" onClick=${() => closeSheet()}><${Icon} n="x" size=${18} /></button>
      </header>
      <div class="sheet-body">${children}</div>
      ${foot && html`<footer class="sheet-foot">${foot}</footer>`}
    </div>
  </div>`;
}
function SheetHost() {
  const sheets = useStore(ui).sheets;
  useEffect(() => {
    const open = sheets.length > 0;
    document.documentElement.classList.toggle('is-sheet', open);
    return undefined;
  }, [sheets.length > 0]);
  if (!sheets.length) return null;
  const top = sheets[sheets.length - 1];
  const C = SHEETS[top.type];
  if (!C) return null;
  return html`<${C} key=${top.id} ...${top.props} closing=${top.closing} />`;
}

/* ── toasts ── */
function Toaster() {
  const [t, setT] = useState(null);
  const timer = useRef(0);
  const arm = (id, ms) => { clearTimeout(timer.current); timer.current = setTimeout(() => setT(cur => (cur && cur.id === id ? null : cur)), ms); };
  useEffect(() => bus.on(ev => {
    if (ev.type === 'toast-clear') { clearTimeout(timer.current); setT(cur => (cur && cur.sticky ? cur : null)); return; }
    if (ev.type !== 'toast') return;
    const id = uid();
    setT(Object.assign({ id }, ev));
    arm(id, ev.chips ? 12000 : ev.long ? 7500 : ev.actions ? 6000 : 3600);
  }), []);
  const close = () => { clearTimeout(timer.current); setT(null); };
  return html`<div class="toasts" role="status" aria-live="polite">
    ${t && html`<div class=${'toast' + (t.tone ? ' toast--' + t.tone : '') + (t.chips ? ' toast--chips' : '')} key=${t.id}>
      <div class="toast-row">
        ${t.icon && html`<${TypeDot} t=${t.icon} size=${30} />`}
        <span class="toast-msg">${t.msg}</span>
        ${(t.actions || []).map(a => html`<button type="button" key=${a.label} class="toast-act" onClick=${() => { close(); a.run(); }}>${a.label}</button>`)}
        <button type="button" class="toast-x" aria-label="Dismiss" onClick=${close}><${Icon} n="x" size=${15} /></button>
      </div>
      ${t.chips && html`<div class="toast-chips">
        <span class="toast-q">${t.chips.title}</span>
        <div class="hscroll">
          ${t.chips.items.map(l => html`<button type="button" key=${l} class="chip chip--sm" onClick=${() => { t.chips.onPick(l); const id = uid(); setT({ id, msg: 'Noted: ' + l, icon: t.icon }); arm(id, 2200); }}>${l}</button>`)}
          ${t.chips.onOther && html`<button type="button" class="chip chip--sm chip--ghost" onClick=${() => { close(); t.chips.onOther(); }}>Something else</button>`}
        </div>
      </div>`}
    </div>`}
  </div>`;
}

/* ── FLIP: rows glide to their new rank instead of teleporting ── */
function useFlip(dep) {
  const ref = useRef(null);
  const last = useRef(new Map());
  useLayoutEffect(() => {
    const root = ref.current;
    if (!root) return;
    const next = new Map();
    const still = reducedMotion();
    root.querySelectorAll('[data-flip]').forEach(el => {
      const k = el.getAttribute('data-flip'), top = el.offsetTop;
      next.set(k, top);
      const was = last.current.get(k);
      if (!still && was != null && Math.abs(was - top) > 2 && el.animate) {
        el.animate([{ transform: 'translateY(' + (was - top) + 'px)' }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1)' });
      }
    });
    last.current = next;
  }, [dep]);
  return ref;
}
/* a number that pops when it changes */
function Count({ value, cls }) {
  const prev = useRef(value);
  const [bump, setBump] = useState(0);
  useEffect(() => { if (prev.current !== value) { prev.current = value; setBump(b => b + 1); } }, [value]);
  return html`<span class=${(cls || '') + (bump ? ' is-bump' : '')} key=${bump}>${value}</span>`;
}

/* shared helpers used across screens */
function currentStop(stops) { let cur = null; for (const s of stops) if (s.a && !s.d && (!cur || s.a > cur.a)) cur = s; return cur; }
const filterKey = f => f.kind + ':' + (f.key || f.id || '');
function filterLabel(f, stops) {
  if (f.kind === 'day') return f.key === partyDay(Date.now()) ? 'today' : dayLong(f.key);
  if (f.kind === 'crawl') return 'the crawl';
  if (f.kind === 'stop') { const s = stops.find(x => x.id === f.id); return s ? s.n : 'that stop'; }
  return 'the whole weekend';
}
/* the same scope, worded to follow a count: "23 drinks at The Rooftop" */
function filterPhrase(f, stops) {
  if (f.kind === 'day') return f.key === partyDay(Date.now()) ? 'today' : 'on ' + dayLong(f.key);
  if (f.kind === 'crawl') return 'on the crawl';
  if (f.kind === 'stop') { const s = stops.find(x => x.id === f.id); return 'at ' + (s ? s.n : 'that stop'); }
  return 'across the whole weekend';
}
const drinkLine = d => (d.l ? d.l : TYPE[d.t].name) + (d.q > 1 ? ' ×' + d.q : '');

/* Log drinks with the full ceremony: write, buzz, bubbles, a toast with Undo and a quick "what was it?" */
function doPour(o, ev) {
  const s = dataStore.get(), u = ui.get();
  const cur = currentStop(s.stops);
  const ts = o.ts || Date.now();
  const stop = o.s !== undefined ? o.s : cur && ts >= cur.a ? cur.id : '';
  const made = A.pour({ pids: o.pids, t: o.t, q: o.q || 1, ts, l: o.l || '', s: stop, by: u.me });
  if (!made.length) return made;
  buzz(o.pids.length > 1 ? 30 : 12);
  ding(o.pids.length > 1 ? 'round' : o.t === 'water' ? 'water' : 'pour');
  if (ev) {
    const el = ev.currentTarget || ev.target;
    const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    if (r) bubbleBurst(r.left + r.width / 2, r.top + r.height / 2, cssVar('--d-' + o.t) || undefined);
  }
  const T = TYPE[o.t], n = made.length, q = made[0].q;
  let msg;
  if (n > 1) msg = 'Round logged: ' + typeCount(o.t, n * q) + '.';
  else {
    const who = made[0].p === u.me ? '' : ' for ' + (P(made[0].p) || { n: 'them' }).n;
    msg = (q === 1 ? T.name : typeCount(o.t, q)) + ' logged' + who + '.';
  }
  if (o.l) rememberLabel(o.t, o.l);
  toast(msg, {
    icon: o.t,
    actions: [{ label: 'Undo', run: () => { A.removeDrinks(made); toast('Removed.'); } }],
    chips: o.l ? null : {
      title: 'What was it?',
      items: labelIdeas(o.t, s.drinks),
      onPick: l => { A.setLabel(made, l); rememberLabel(o.t, l); },
      onOther: n === 1 ? () => openSheet('drink', { id: made[0].id, day: made[0].day }) : null,
    },
  });
  return made;
}

function FilterBar({ days, stops, cls }) {

    items.push({ label: k === today ? 'Today' : weekdays[i] + (twice ? ' ' + (k % 100) : ''), f: { kind: 'day', key: k } });
  });

  const avg = boardAll.active ? boardAll.tot.count / boardAll.active : 0;
  let line;
  if (!r.count) line = 'The guest of honor. The weekend is his.';
  else {
    const vs = avg ? r.count / avg : 1;
    line = (r.tied ? 'Tied for ' : '') + ordinal(r.rank) + ' on the weekend' + (vs >= 1.15 ? ', running ' + nice(vs) + '× the crew average' : vs <= 0.85 ? ', pacing under the crew average' : ', right at the crew average') + '.';
  }
  return html`<button type="button" class="groomcard" onClick=${() => openSheet('profile', { pid: groom.id })}>
    <${Avatar} p=${groom} size=${44} />
    <span class="groom-txt"><span class="eyebrow">Goof watch</span><b>${groom.k || groom.n}</b><span class="muted">${line}</span></span>
    <span class="groom-n"><b>${r.count}</b><small>${r.lastAlc ? 'last ' + fmtAgo(r.lastAlc, now) : 'no pours'}</small></span>
  </button>`;
}

/* ───────────────────────── the crawl ───────────────────────── */
function AddStop({ first }) {
  const [name, setName] = useState('');
  const [note, setNote] = useState('');
  const submit = e => {
    e.preventDefault();
    if (!cleanText(name)) return;
    A.addStop({ n: name, note });
    setName(''); setNote('');
  };
  return html`<form class="addstop" onSubmit=${submit}>
    <div class="addstop-row">
      <label class="sr" for="stop-name">Bar name</label>
      <input id="stop-name" class="input" type="text" maxlength="40" autocomplete="off" placeholder=${first ? 'First bar' : 'Next bar'} value=${name} onInput=${e => setName(e.target.value)} />
      <button type="submit" class="btn btn--primary" disabled=${!cleanText(name)}><${Icon} n="plus" size=${16} /> Add</button>
    </div>
    ${cleanText(name) && html`<div>
      <label class="sr" for="stop-note">Note</label>
      <input id="stop-note" class="input input--sm" type="text" maxlength="90" autocomplete="off" placeholder="Note, like the meet time or the cover (optional)" value=${note} onInput=${e => setNote(e.target.value)} />
    </div>`}
  </form>`;
}

function NowCard({ crawl, byId, me, act }) {
  const c = crawl.cur, s = c.stop;
  const mine = me ? dataStore.get().checkins.find(x => x.s === s.id && x.p === me.id) : null;
  const drank = !!me && dataStore.get().drinks.some(x => x.s === s.id && x.p === me.id); // a drink here already counts as being here
  const people = c.people.map(id => byId[id]).filter(Boolean);
  return html`<section class="card now">
    <div class="now-head">
      <span class="eyebrow eyebrow--live"><span class="live-dot" aria-hidden="true"></span>Now at</span>
      <span class="now-time"><${Icon} n="clock" size=${14} /> ${fmtDur(c.dur)}</span>
    </div>
    <h3 class="now-name">${s.n}</h3>
    ${s.note && html`<p class="now-note">${s.note}</p>`}
    <div class="now-stats">
      <div class="num"><${Count} value=${c.drinks} cls="num-v" /><span class="num-l">${plural(c.drinks, 'drink')} here</span></div>
      <div class="num"><span class="num-v">${people.length}</span><span class="num-l">checked in</span></div>
      ${c.mvp && byId[c.mvp.pid] && html`<div class="now-mvp"><${Avatar} p=${byId[c.mvp.pid]} size=${30} /><span><span class="num-l">Bar MVP</span><b>${shortName(byId[c.mvp.pid].n)} (${c.mvp.n})</b></span></div>`}
    </div>
    ${people.length > 0 && html`<div class="now-here"><${AvatarStack} list=${people} max=${9} size=${28} /></div>`}
    ${me && act && html`<div class="now-me">
      ${drank
        ? html`<span class="herechip"><${Icon} n="check" size=${16} /> You're here</span>`
        : html`<button type="button" class=${'btn btn--sm ' + (mine ? 'btn--on' : 'btn--quiet')} aria-pressed=${!!mine} onClick=${() => A.checkIn(s.id, me.id, !mine)}>
            <${Icon} n=${mine ? 'check' : 'pin'} size=${16} /> ${mine ? "I'm here" : 'Check in'}
          </button>`}
      <span class="now-rate"><span class="num-l">Your rating</span><${Stars} value=${mine ? mine.r : 0} onRate=${v => A.rate(s.id, me.id, v)} /></span>
    </div>`}
    ${act && html`<div class="now-acts">
      ${crawl.next
        ? html`<button type="button" class="btn btn--primary btn--lg" onClick=${() => { A.arrive(crawl.next.stop.id); toast('On to ' + crawl.next.stop.n + '.'); }}>Next stop: ${crawl.next.stop.n}</button>`
        : html`<button type="button" class="btn btn--primary btn--lg" onClick=${() => { A.leave(s.id); toast('Crawl wrapped.'); }}>Wrap up the crawl</button>`}
    </div>`}
  </section>`;
}

function StopRow({ r, i, crawl, byId, act }) {
  const s = r.stop;
  const people = r.people.map(id => byId[id]).filter(Boolean);
  const upNext = crawl.next && crawl.next.stop.id === s.id;
  const state = r.status === 'now' ? ['Here now', fmtDur(r.dur)] : r.status === 'done' ? [fmtTime(s.a), r.dur ? fmtDur(r.dur) : ''] : [upNext ? 'Up next' : 'Later', ''];
  const pct = crawl.maxDrinks ? Math.max(r.drinks ? 4 : 0, (r.drinks / crawl.maxDrinks) * 100) : 0;
  return html`<li class=${'stop stop--' + r.status + (s.pend ? ' is-pend' : '')}>
    <span class="stop-node" aria-hidden="true">${r.status === 'done' ? html`<${Icon} n="check" size=${14} />` : i + 1}</span>
    <div class="stop-body">
      <div class="stop-top">
        <h3 class="stop-n">${s.n}</h3>
        <span class="stop-state">${state[0]}${state[1] && html`<span class="sr">, </span><i>${state[1]}</i>`}</span>
      </div>
      ${s.note && html`<p class="stop-note">${s.note}</p>`}
      ${r.status !== 'next' && html`<div class="stop-stats">
        <span class="stop-bar" ...${tipProps(() => ({ title: s.n, rows: [{ value: r.drinks, label: plural(r.drinks, 'drink') }, { value: people.length, label: 'checked in' }].concat(r.zero ? [{ value: r.zero, label: 'water and zero proof' }] : []) }))}><i style=${'width:' + pct.toFixed(1) + '%'}></i></span>
        <span class="stop-ct"><b>${r.drinks}</b> ${plural(r.drinks, 'drink')}</span>
      </div>`}
      ${r.status !== 'next' && (people.length > 0 || r.votes > 0) && html`<div class="stop-meta">
        ${people.length > 0 && html`<${AvatarStack} list=${people} max=${7} size=${22} />`}
        ${r.votes > 0 && html`<span class="stop-rate"><${Icon} n="star" size=${13} cls="is-on" /> ${nice(r.rating)}</span>`}
        ${r.mvp && byId[r.mvp.pid] && html`<span class="stop-mvp">MVP ${shortName(byId[r.mvp.pid].n)} (${r.mvp.n})</span>`}
      </div>`}
      ${act && upNext && !crawl.cur && html`<button type="button" class="btn btn--sm btn--primary stop-go" onClick=${() => { A.arrive(s.id); toast("You're at " + s.n + '. Drinks logged now count for this stop.', { long: true }); }}>We're here</button>`}
    </div>
    ${act && html`<button type="button" class="iconbtn stop-more" aria-label=${'Edit ' + s.n} onClick=${() => openSheet('stop', { id: s.id })}><${Icon} n="more" size=${18} /></button>`}
  </li>`;
}

function CrawlPanel({ d, crawl, me, act }) {
  const byId = useMemo(() => indexBy(d.players), [d.players]);
  const total = crawl.rows.length;
  const finished = total > 0 && !crawl.cur && crawl.visited === total;
  const best = crawl.rows.filter(r => r.votes > 0).sort((a, b) => b.rating - a.rating)[0];
  const busiest = crawl.rows.filter(r => r.drinks > 0).sort((a, b) => b.drinks - a.drinks)[0];
  return html`<section class="panel" data-panel="crawl" aria-label="The crawl">
    <header class="panel-head">
      <h2 class="panel-title">The Crawl</h2>
      ${total > 0 && html`<p class="panel-sub">${crawl.visited} of ${total} ${plural(total, 'stop')}${crawl.drinks ? ', ' + crawl.drinks + ' ' + plural(crawl.drinks, 'drink') : ''}${crawl.elapsed > MIN ? ', ' + fmtDur(crawl.elapsed) + (finished ? ' door to door' : ' so far') : ''}</p>`}
    </header>
    ${total > 0 && html`<${CrawlOverview} crawl=${crawl} players=${d.players} me=${me} act=${act} />`}
    ${crawl.cur && html`<${NowCard} crawl=${crawl} byId=${byId} me=${me} act=${act} />`}
    ${finished && html`<section class="card wrap">
      <span class="eyebrow">That's a wrap</span>
      <h3 class="now-name">${total} ${plural(total, 'stop')}, ${crawl.drinks} ${plural(crawl.drinks, 'drink')}</h3>
      <p class="muted">${[crawl.elapsed > MIN ? fmtDur(crawl.elapsed) + ' door to door' : '', busiest ? 'Biggest stop: ' + busiest.stop.n : '', best ? 'Best rated: ' + best.stop.n + ' (' + nice(best.rating) + ')' : ''].filter(Boolean).join('. ') + '.'}</p>
    </section>`}
    ${total === 0
      ? html`<section class="card">
          <${Empty} icon="crawl" title="No stops yet">
            ${act ? 'Add the bars in the order you plan to hit them. You can add, reorder, or skip any time.' : 'Stops show up here once the organizer adds them.'}
          <//>
          ${act && html`<div class="card-pad card-pad--top0"><${AddStop} first=${true} /></div>`}
        </section>`
      : html`<section class="card route-card">
          <ol class="route">
            ${crawl.rows.map((r, i) => html`<${StopRow} key=${r.stop.id} r=${r} i=${i} crawl=${crawl} byId=${byId} act=${act} />`)}
          </ol>
          ${act && html`<div class="card-pad card-pad--line"><${AddStop} first=${false} /></div>`}
        </section>`}
    ${total > 0 && !crawl.cur && !finished && html`<p class="hint">${act ? 'Tap "We\'re here" when you walk in. Drinks logged after that count for the stop.' : 'The crawl has not started.'}</p>`}
  </section>`;
}

SHEETS.stop = function StopSheet({ id, closing }) {
  const d = useStore(dataStore);
  const s = d.stops.find(x => x.id === id);
  const [name, setName] = useState(s ? s.n : '');
  const [note, setNote] = useState(s ? s.note : '');
  const [sure, setSure] = useState(false);
  if (!s) return html`<${Sheet} title="Stop" closing=${closing}><p class="muted">This stop was removed.</p><//>`;
  const i = d.stops.findIndex(x => x.id === id);
  const live = s.a > 0 && !s.d;
  const save = () => { if (cleanText(name) !== s.n || cleanText(note, 90) !== s.note) A.updateStop(id, { n: name, note }); closeSheet(); };
  return html`<${Sheet} title="Edit stop" sub=${'Stop ' + (i + 1) + ' of ' + d.stops.length} closing=${closing}
    foot=${html`<button type="button" class="btn btn--primary btn--block" onClick=${save}>Save</button>`}>
    <div class="field"><label for="st-name">Bar</label><input id="st-name" class="input" type="text" maxlength="40" autocomplete="off" value=${name} onInput=${e => setName(e.target.value)} /></div>
    <div class="field"><label for="st-note">Note</label><input id="st-note" class="input" type="text" maxlength="90" autocomplete="off" placeholder="Meet time, cover, who to ask for" value=${note} onInput=${e => setNote(e.target.value)} /></div>
    <div class="menu">
      ${!live && html`<button type="button" class="menu-i" onClick=${() => { A.arrive(id); closeSheet(); toast("You're at " + s.n + '.'); }}><${Icon} n="pin" /> <span>We're here now</span></button>`}
      ${live && html`<button type="button" class="menu-i" onClick=${() => { A.leave(id); closeSheet(); }}><${Icon} n="door" /> <span>We left</span></button>`}
      <button type="button" class="menu-i" disabled=${i === 0} onClick=${() => A.moveStop(id, -1)}><${Icon} n="up" /> <span>Move earlier</span></button>
      <button type="button" class="menu-i" disabled=${i === d.stops.length - 1} onClick=${() => A.moveStop(id, 1)}><${Icon} n="down" /> <span>Move later</span></button>
      <button type="button" class="menu-i" onClick=${() => { ui.set({ filter: { kind: 'stop', id } }); closeSheet(); setTab('board'); }}><${Icon} n="board" /> <span>Show this stop on the board</span></button>
      ${(s.a > 0 || s.d > 0) && html`<button type="button" class="menu-i" onClick=${() => { A.resetStop(id); closeSheet(); }}><${Icon} n="undo" /> <span>Mark as not visited</span></button>`}
      ${sure
        ? html`<div class="confirm"><span>Remove ${s.n}? Drinks logged there stay on the board.</span><button type="button" class="btn btn--sm btn--danger" onClick=${() => { A.removeStop(id); closeSheet(); }}>Remove</button><button type="button" class="btn btn--sm btn--ghost" onClick=${() => setSure(false)}>Keep</button></div>`
        : html`<button type="button" class="menu-i menu-i--danger" onClick=${() => setSure(true)}><${Icon} n="trash" /> <span>Remove stop</span></button>`}
    </div>
  <//>`;
};

/* ───────────────────────── stats: tiles, the race, hours, mix, awards, heat ───────────────────────── */
function StatStrip({ board, hs, players }) {
  const t = board.tot;
  const per = board.active ? t.count / board.active : 0;
  const peak = hs.peak >= 0 ? hs.cols[hs.peak] : null;
  const tiles = [
    { l: 'Drinks', v: t.count, s: board.active ? 'from ' + board.active + ' of ' + players.length + ' on the crew' : 'nothing logged yet' },
    { l: 'Per guy', v: per ? nice(per) : '0', s: board.active ? 'average, drinkers only' : 'average' },
    { l: 'Waters', v: t.water, s: t.water && t.count ? 'one for every ' + nice(t.count / t.water) + ' drinks' : t.count ? 'none yet. Hydrate.' : 'none yet' },
    { l: 'Peak hour', v: peak ? fmtHour(peak.h) : '–', s: peak ? peak.total + ' ' + plural(peak.total, 'drink') + (hs.tod ? ', all nights' : '') : 'no pours yet' },
  ];
  return html`<div class="tiles">
    ${tiles.map(x => html`<div class="tile" key=${x.l}><span class="tile-l">${x.l}</span><span class="tile-v">${x.v}</span><span class="tile-s">${x.s}</span></div>`)}
  </div>`;
}

function RaceChart({ race, meId }) {
  const [ref, w] = useWidth();
  const [hover, setHover] = useState(null);
  const svg = useRef(null);
  let chart = null, legend = null;
  if (race && w > 0) {
    const wide = w >= 540;
    const m = { l: 30, r: wide ? 86 : 14, t: 12, b: 26 }, H = wide ? 264 : 220;
    const iw = Math.max(40, w - m.l - m.r), ih = H - m.t - m.b, span = race.t1 - race.t0;
    const X = t => m.l + ((t - race.t0) / span) * iw;
    const step = niceStep(race.max * 1.06, 5), top = Math.max(step, Math.ceil((race.max * 1.06) / step) * step);
    const Y = v => m.t + ih - (v / top) * ih;
    const hi = race.series.slice(0, 5);
    const mine = race.series.find(s => s.pid === meId);
    if (mine && hi.indexOf(mine) === -1) hi.push(mine);
    const rest = race.series.filter(s => hi.indexOf(s) === -1);
    const path = s => { let p = 'M' + X(race.t0).toFixed(1) + ' ' + Y(0).toFixed(1); for (const pt of s.pts) p += 'H' + X(pt[0]).toFixed(1) + 'V' + Y(pt[1]).toFixed(1); return p + 'H' + X(race.end).toFixed(1); };
    // x ticks on whole hours
    const hours = span / HOUR;
    const ladder = [1, 2, 3, 6, 12, 24];
    let hi0 = ladder.findIndex(s => hours / s <= Math.max(2, Math.floor(iw / 46)));
    const hstep = ladder[hi0 < 0 ? ladder.length - 1 : hi0];
    const ticks = [];
    let t = floorHour(race.t0);
    for (let guard = 0; guard < 30 && new Date(t).getHours() % hstep !== 0; guard++) t += HOUR;
    for (; t <= race.t1 + 1000; t += hstep * HOUR) if (t >= race.t0 - 1000) ticks.push(t);
    const yticks = [];
    for (let v = 0; v <= top; v += step) yticks.push(v);
    // end labels, nudged apart
    const ends = hi.map(s => ({ s, y: Y(s.total), ly: Y(s.total) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 14) ends[i].ly = ends[i - 1].ly + 14;
    const over = ends.length ? ends[ends.length - 1].ly - (m.t + ih) : 0;
    if (over > 0) { for (const e of ends) e.ly -= over; for (let i = ends.length - 2; i >= 0; i--) if (ends[i + 1].ly - ends[i].ly < 14) ends[i].ly = ends[i + 1].ly - 14; }
    const onMove = e => {
      const r = svg.current.getBoundingClientRect();
      const tt = clamp(race.t0 + ((e.clientX - r.left - m.l) / iw) * span, race.t0, race.end);
      setHover(tt);
      const rows = hi.map(s => ({ color: 'var(--q' + s.p.c + ')', value: valueAt(s.pts, tt), label: shortName(s.p.n) })).sort((a, b) => b.value - a.value);
      showTip(e, { title: WD[new Date(tt).getDay()] + ' ' + fmtTime(tt), rows });
    };
    const onLeave = e => { setHover(null); if (!e || e.pointerType !== 'touch') hideTip(); };
    chart = html`<svg ref=${svg} class="chart" width=${w} height=${H} viewBox=${'0 0 ' + w + ' ' + H} role="img" aria-label=${'Running total of drinks over time. ' + race.series.slice(0, 3).map(s => s.p.n + ' ' + s.total).join(', ') + '.'}>
      ${yticks.map(v => html`<g key=${'y' + v}><line class=${v === 0 ? 'axis' : 'grid'} x1=${m.l} x2=${m.l + iw} y1=${Y(v)} y2=${Y(v)} /><text class="tick" x=${m.l - 7} y=${Y(v) + 3.5} text-anchor="end">${v}</text></g>`)}
      ${ticks.map(tk => { const hr = new Date(tk).getHours(); return html`<text key=${'x' + tk} class=${'tick' + (hr === 0 && hours > 24 ? ' tick--day' : '')} x=${X(tk)} y=${H - 8} text-anchor="middle">${hr === 0 && hours > 24 ? WD[new Date(tk).getDay()] : fmtHour(hr, true)}</text>`; })}
      ${rest.map(s => html`<path key=${s.pid} class="race-rest" d=${path(s)} />`)}
      ${hi.slice().reverse().map(s => html`<path key=${s.pid} class=${'race-line' + (s.pid === meId ? ' is-me' : '')} d=${path(s)} style=${'--c:var(--q' + s.p.c + ')'} />`)}
      ${hover != null && html`<line class="cross" x1=${X(hover)} x2=${X(hover)} y1=${m.t} y2=${m.t + ih} />`}
      ${hover != null && hi.map(s => html`<circle key=${'h' + s.pid} class="race-dot" cx=${X(hover)} cy=${Y(valueAt(s.pts, hover))} r="4" style=${'--c:var(--q' + s.p.c + ')'} />`)}
      ${ends.map(e => html`<g key=${'e' + e.s.pid}>
        ${wide && Math.abs(e.ly - e.y) > 3 && html`<line class="leader" x1=${X(race.end) + 6} y1=${e.y} x2=${X(race.end) + 12} y2=${e.ly} />`}
        <circle class="race-end" cx=${X(race.end)} cy=${e.y} r="4.5" style=${'--c:var(--q' + e.s.p.c + ')'} />
        ${wide && html`<text class="endlabel" x=${X(race.end) + 14} y=${e.ly + 4}>${shortName(e.s.p.n).slice(0, 10)} ${e.s.total}</text>`}
      </g>`)}
      <rect class="hit" x=${m.l} y=${m.t} width=${iw} height=${ih} onPointerMove=${onMove} onPointerDown=${onMove} onPointerLeave=${onLeave} />
    </svg>`;
    legend = html`<ul class="legend legend--lines">
      ${hi.map(s => html`<li key=${s.pid}><i class="lk" style=${'--c:var(--q' + s.p.c + ')'}></i>${shortName(s.p.n)}${s.pid === meId ? ' (you)' : ''} <b>${s.total}</b></li>`)}
      ${rest.length > 0 && html`<li><i class="lk lk--rest"></i>${rest.length} more</li>`}
    </ul>`;
  }
  return html`<section class="card race">
    <header class="card-head"><div><h2 class="card-title">The Race</h2><p class="card-sub">Running totals. Top five${meId ? ', plus you' : ''}.</p></div></header>
    <div class="card-pad chart-wrap" ref=${ref}>
      ${race ? chart : html`<${Empty} icon="stats" title="The race starts with the first pour">Each line climbs as that guy logs drinks.<//>`}
      ${legend}
    </div>
  </section>`;
}

function HourChart({ hs }) {
  const [ref, w, h] = useWidth();
  let chart = null;
  if (hs.cols.length && w > 0) {
    // On a wide screen the card is stretched to match The Mix and the chart, laid over the card's body, fills it.
    // Anywhere else the chart sets the height itself, so it must not read its own height back.
    const fills = typeof matchMedia === 'function' && matchMedia('(min-width: 900px)').matches;
    const H = fills && h > 250 ? h : 184, m = { l: 26, r: 6, t: 22, b: 24 };
    const n = hs.cols.length, iw = Math.max(40, w - m.l - m.r), ih = H - m.t - m.b, band = iw / n, bw = clamp(band - 3, 2, 24);
    const step = niceStep(hs.max, 4), top = Math.max(step, Math.ceil(hs.max / step) * step);
    const Y = v => m.t + ih - (v / top) * ih, base = m.t + ih;
    const every = Math.max(1, Math.ceil(30 / band));
    const yticks = [];
    for (let v = 0; v <= top; v += step) yticks.push(v);
    chart = html`<svg class="chart" width=${w} height=${H} viewBox=${'0 0 ' + w + ' ' + H} role="img" aria-label=${'Drinks per hour. Busiest hour ' + (hs.peak >= 0 ? fmtHour(hs.cols[hs.peak].h) + ' with ' + hs.max : 'none') + '.'}>
      ${yticks.map(v => html`<g key=${'y' + v}><line class=${v === 0 ? 'axis' : 'grid'} x1=${m.l} x2=${m.l + iw} y1=${Y(v)} y2=${Y(v)} /><text class="tick" x=${m.l - 7} y=${Y(v) + 3.5} text-anchor="end">${v}</text></g>`)}
      ${hs.cols.map((c, i) => {
        const x = m.l + i * band + (band - bw) / 2, y = Y(c.total), hgt = base - y, r = Math.min(4, bw / 2, hgt);
        const d = hgt > 0.5 ? 'M' + x.toFixed(1) + ' ' + base + 'V' + (y + r).toFixed(1) + 'Q' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ' ' + y.toFixed(1) + 'H' + (x + bw - r).toFixed(1) + 'Q' + (x + bw).toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + bw).toFixed(1) + ' ' + (y + r).toFixed(1) + 'V' + base + 'Z' : '';
        const title = hs.tod ? fmtHour(c.h) + ' hour, all nights' : WD[new Date(c.t0).getDay()] + ' ' + fmtHour(c.h);
        const make = () => ({ title, rows: [{ value: c.total, label: plural(c.total, 'drink') }].concat(STACK.filter(t => c.by[t]).map(t => ({ color: 'var(--d-' + t + ')', value: c.by[t], label: c.by[t] === 1 ? TYPE[t].name.toLowerCase() : TYPE[t].many }))) });
        return html`<g key=${i} class="hcol">

function TabPanel({ d, me, act, boardAll }) {
  const [onlyMe, setOnlyMe] = useState(false);

  const stopsById = useMemo(() => indexBy(d.stops), [d.stops]);
  const list = useMemo(() => {
    const out = [];
    for (let i = d.drinks.length - 1; i >= 0; i--) { const x = d.drinks[i]; if (!byId[x.p]) continue; if (onlyMe && me && x.p !== me.id) continue; if (query && ![byId[x.p].n,TYPE[x.t].name,x.l,stopsById[x.s]&&stopsById[x.s].n].filter(Boolean).join(' ').toLowerCase().includes(query.trim().toLowerCase())) continue; out.push(x); }
    return out;
  }, [d.drinks, byId, onlyMe, me && me.id, query, stopsById]);
  const sections = useMemo(() => {
    const days = [], rounds = new Map(), totals = new Map();
    for (const x of list) { const k = partyDay(x.ts); const t = totals.get(k) || { n: 0, w: 0 }; if (isAlc(x.t)) t.n += x.q; else t.w += x.q; totals.set(k, t); }
    for (const x of list.slice(0, limit)) {
      const k = partyDay(x.ts);
      let sec = days[days.length - 1];
      if (!sec || sec.key !== k) days.push((sec = { key: k, items: [], tot: totals.get(k) }));
      if (x.r) {
        let g = rounds.get(x.r);
        if (!g) { g = { kind: 'round', r: x.r, ts: x.ts, by: x.by, t: x.t, l: x.l, s: x.s, drinks: [] }; rounds.set(x.r, g); sec.items.push(g); }
        g.drinks.push(x);
      } else sec.items.push({ kind: 'one', x });
    }
    return days;
  }, [list, limit]);
  const tot = useMemo(() => computeBoard(d.players,list).tot, [d.players,list]);
  return html`<section class="panel" data-panel="tab" aria-label="The tab">
    <header class="panel-head panel-head--row">
      <div><h2 class="panel-title">The Tab</h2><p class="panel-sub">Every pour, newest first${act ? '. Tap one to fix it.' : '.'}</p></div>
      ${me && html`<div class="seg2" role="group" aria-label="Whose drinks">

      </div>`}
    </header>
    <div class="tab-tools"><label class="sr" for="tab-search">Search the tab by name, drink, or bar</label><input class="input" id="tab-search" type="search" placeholder="Search the tab" value=${query} onInput=${e=>{setQuery(e.target.value);setLimit(50);}}/><button type="button" class="btn btn--quiet" disabled=${!list.length} onClick=${()=>exportTab(list,d.players,d.stops)}><${Icon} n="download" size=${17}/> Export view</button></div>
    ${query && html`<p class="tab-match-count">${list.length} matching ${plural(list.length,'entry','entries')}</p>`}
    <div class="receipt">
      <div class="rc-head">
        <span class="rc-brand">Goof Proof</span>
        <span class="rc-sub">${d.trip.title || DEFAULT_TRIP}</span>
      </div>
      ${!list.length && html`<div class="rc-empty">${query?'No matching drinks. Try a different name, label, or bar.':onlyMe?'Nothing on your tab yet.':'The tab is open. Nothing on it yet.'}</div>`}
      ${sections.map(sec => html`<div class="rc-day" key=${sec.key}>
        <div class="rc-dayhead"><span>${dayMed(sec.key)}</span><span>${sec.tot.n} ${plural(sec.tot.n, 'drink')}${sec.tot.w ? ' + ' + sec.tot.w + ' zero proof' : ''}</span></div>
        <ul class="rc-list">
          ${sec.items.map(it => {
            if (it.kind === 'one') return html`<${TabRow} key=${it.x.id} x=${it.x} byId=${byId} stopsById=${stopsById} act=${act} />`;
            if (it.drinks.length === 1) return html`<${TabRow} key=${it.drinks[0].id} x=${it.drinks[0]} byId=${byId} stopsById=${stopsById} act=${act} />`;
            const isOpen = !!open[it.r], caller = it.by ? byId[it.by] : null;
            const n = sum(it.drinks, x => x.q);
            return html`<li class="rc-i rc-round" key=${it.r}>
              <button type="button" class="rc-b" aria-expanded=${isOpen} onClick=${() => setOpen(o => Object.assign({}, o, { [it.r]: !o[it.r] }))}>
                <span class="rc-t">${fmtTime(it.ts)}</span>
                <span class="rc-bell"><${Icon} n="bell" size=${15} /></span>
                <span class="rc-m">
                  <b>Round of ${n}</b>
                  <span>${it.l ? it.l + ' ' + TYPE[it.t].many : TYPE[it.t].many.charAt(0).toUpperCase() + TYPE[it.t].many.slice(1)}${it.s && stopsById[it.s] ? ' at ' + stopsById[it.s].n : ''}${caller ? ', called by ' + shortName(caller.n) : ''}</span>
                </span>
                <span class="rc-q"><${AvatarStack} list=${it.drinks.map(x => byId[x.p])} max=${3} size=${20} /><${Icon} n="chevD" size=${14} cls=${'rc-chev' + (isOpen ? ' is-open' : '')} /></span>
              </button>
              ${isOpen && html`<ul class="rc-list rc-list--in">${it.drinks.map(x => html`<${TabRow} key=${x.id} x=${x} byId=${byId} stopsById=${stopsById} act=${act} inner=${true} />`)}</ul>`}
            </li>`;
          })}
        </ul>
      </div>`)}
      ${list.length > limit && html`<button type="button" class="rc-more" onClick=${() => setLimit(l => l + 100)}>Show ${Math.min(100, list.length - limit)} older</button>`}
      ${tot.entries > 0 && html`<div class="rc-foot">
        <div class="rc-line rc-line--big"><span>Total</span><span>${tot.count} ${plural(tot.count, 'drink')}</span></div>
        <div class="rc-line"><span>Water</span><span>${tot.water}</span></div>
        <div class="rc-line"><span>Zero proof</span><span>${tot.zero}</span></div>
        <div class="rc-thanks">Thank you. Tip your bartender.</div>
      </div>`}
    </div>
  </section>`;
}

SHEETS.player = function PlayerSheet({ pid, closing }) {

  if (!p) return html`<${Sheet} title="Gone" closing=${closing}><p class="muted">He was removed from the crew.</p><//>`;
  const save = () => {

/* Shared HTTP store: server state is authoritative; createSync owns the offline outbox. */
function HttpStore(base, pollMs) {
  const watchers = new Map();
  let cols = null, rev = 0, timer = 0, busy = false, again = false;
  const list = col => Object.keys((cols && cols[col]) || {}).map(id => ({ id, data: cols[col][id] }));
  const tell = () => watchers.forEach((set, col) => { const l = list(col); set.forEach(next => next(l, {})); });
  const health = ok => dataStore.set({ syncOffline: !ok });
  async function pull() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      const r = await fetch(base + '/state' + (cols ? '?since=' + rev : ''), { cache: 'no-store', signal: typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined });
      if (!r.ok) throw new Error('Board unavailable');
      const s = await r.json();
      if (!s || !Number.isSafeInteger(s.rev)) throw new Error('Invalid board');
      if (s.cols && s.rev >= rev) { cols = s.cols; rev = s.rev; tell(); }
      health(true);
    } catch (e) { health(false); }
    finally { busy = false; }
    if (again && watchers.size) { again = false; pull(); }
  }
  async function write(kind, path, data) {
    let r;
    try { r = await fetch(base + '/write', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ops: [{ kind, path, data }] }), signal: typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined }); }
    catch (e) { health(false); throw { code: 'unavailable' }; }
    if (r.status === 429 || r.status >= 500) { health(false); throw { code: 'unavailable' }; }
    if (!r.ok) throw { code: 'invalid_argument' };
    const out = await r.json().catch(() => null);
    if (!out || !Array.isArray(out.results)) throw { code: 'unavailable' };
    if (out.results[0] === 'missing') throw { code: 'invalid_argument' };
    if (out.results[0] === 'full') throw { code: 'quota_exceeded' };
    if (out.results[0] !== 'ok') throw { code: 'unavailable' };
    health(true);
    pull();
  }
  const resume = () => { if (!document.hidden) pull(); };
  return {
    kind: 'http',
    watch(col, next) {
      let set = watchers.get(col);
      if (!set) watchers.set(col, (set = new Set()));
      set.add(next);
      if (cols) Promise.resolve().then(() => { if (set.has(next)) next(list(col), {}); });
      if (!timer) {
        timer = setInterval(() => { if (!document.hidden) pull(); }, pollMs || 2500);
        document.addEventListener('visibilitychange', resume);
        window.addEventListener('online', resume);
        pull();
      }
      return () => {
        set.delete(next); if (!set.size) watchers.delete(col);
        if (!watchers.size) { clearInterval(timer); timer = 0; document.removeEventListener('visibilitychange', resume); window.removeEventListener('online', resume); }
      };
    },
    set: (path, data) => write('set', path, data),
    update: (path, data) => write('update', path, data),
    del: path => write('delete', path),
  };
}
/* Shared Supabase store: the same contract as HttpStore, backed by the goofproof_docs table and its two functions. */

  const watchers = new Map();
  const rest = cfg.url.replace(/\/+$/, '') + '/rest/v1/';

function RecapActions({ d, shot }) {

      } else downloadBlob(blob, file.name);

async function boot() {

  const cached = createSync(NullBackend(), { cacheKey: K.cache, writable: false });
  attach(cached, 'boot');
  window.addEventListener('online', () => { dataStore.set({ online: true }); if (engine.sync) engine.sync.kick(); });
  window.addEventListener('offline', () => dataStore.set({ online: false }));

  if (tabs.indexOf(tab) === -1) tab = hot && tabs.indexOf(hot.tab) !== -1 ? hot.tab : ls.get(K.tab, 'board');
